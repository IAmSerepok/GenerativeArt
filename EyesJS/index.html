<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            gap: 20px;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 30px;
        }

        /* Левая панель с квадратом */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #square-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1/1;
        }

        #square {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0f3460;
            border: 4px solid #4cc9f0;
            border-radius: 15px;
            box-shadow: 
                0 0 30px rgba(76, 201, 240, 0.3),
                inset 0 0 30px rgba(76, 201, 240, 0.1);
            overflow: hidden;
            transition: all 0.3s;
        }

        /* Правая панель управления */
        .right-panel {
            flex: 0 0 350px;
            background: rgba(15, 52, 96, 0.7);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(76, 201, 240, 0.3);
            display: flex;
            flex-direction: column;
            max-height: 800px;
        }

        .panel-title {
            color: #4cc9f0;
            font-size: 1.3rem;
            margin-bottom: 25px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(76, 201, 240, 0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Стилизация скроллбара */
        .controls::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track {
            background: rgba(76, 201, 240, 0.1);
            border-radius: 4px;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #4cc9f0;
            border-radius: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.95rem;
            color: #b8b8d1;
            font-weight: 500;
        }

        .value-display {
            color: #4cc9f0;
            font-weight: bold;
            min-width: 40px;
            text-align: right;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 10px;
            background: linear-gradient(to right, #4361ee, #4cc9f0);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            border: 2px solid #4cc9f0;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            background: linear-gradient(135deg, #4361ee, #3a56d4);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        #clearBtn {
            background: linear-gradient(135deg, #f72585, #b5179e);
        }

        /* Глаза */
        .eye {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            overflow: hidden;
        }

        .eye-outer {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: white;
            box-shadow: 
                0 0 15px rgba(0, 0, 0, 0.3),
                inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .eye-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-color: #222;
            transition: all 0.08s ease-out;
        }

        /* Адаптивность */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            
            .right-panel {
                flex: 0 0 auto;
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
            }
            
            #square-container {
                max-width: 500px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                gap: 10px;
            }
            
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-panel">
            <div id="square-container">
                <div id="square"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel-title">Управление глазами</div>
            
            <div class="controls">
                <div class="control-group">
                    <div class="control-header">
                        <label for="eyeCount">Количество глаз</label>
                        <span class="value-display" id="eyeCountValue">20</span>
                    </div>
                    <input type="range" id="eyeCount" min="1" max="100" value="20">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label>Размер глаз</label>
                        <span class="value-display" id="sizeRangeValue">20-60px</span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div>
                            <div class="control-header">
                                <label for="minEyeSize" style="font-size: 0.85rem;">Минимальный</label>
                                <span class="value-display" id="minEyeSizeValue">20px</span>
                            </div>
                            <input type="range" id="minEyeSize" min="10" max="60" value="20">
                        </div>
                        <div>
                            <div class="control-header">
                                <label for="maxEyeSize" style="font-size: 0.85rem;">Максимальный</label>
                                <span class="value-display" id="maxEyeSizeValue">60px</span>
                            </div>
                            <input type="range" id="maxEyeSize" min="30" max="100" value="60">
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label for="pupilSize">Размер зрачков</label>
                        <span class="value-display" id="pupilSizeValue">50%</span>
                    </div>
                    <input type="range" id="pupilSize" min="20" max="80" value="50">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label for="spacing">Расстояние между глазами</label>
                        <span class="value-display" id="spacingValue">10px</span>
                    </div>
                    <input type="range" id="spacing" min="0" max="50" value="10">
                </div>

                <div class="buttons">
                    <button id="generateBtn">Reset</button>
                    <button id="addEyeBtn">Add one</button>
                    <button id="clearBtn">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Элементы DOM
        const square = document.getElementById('square');
        const squareContainer = document.getElementById('square-container');
        const eyeCountSlider = document.getElementById('eyeCount');
        const eyeCountValue = document.getElementById('eyeCountValue');
        const minEyeSizeSlider = document.getElementById('minEyeSize');
        const minEyeSizeValue = document.getElementById('minEyeSizeValue');
        const maxEyeSizeSlider = document.getElementById('maxEyeSize');
        const maxEyeSizeValue = document.getElementById('maxEyeSizeValue');
        const sizeRangeValue = document.getElementById('sizeRangeValue');
        const pupilSizeSlider = document.getElementById('pupilSize');
        const pupilSizeValue = document.getElementById('pupilSizeValue');
        const spacingSlider = document.getElementById('spacing');
        const spacingValue = document.getElementById('spacingValue');
        const generateBtn = document.getElementById('generateBtn');
        const addEyeBtn = document.getElementById('addEyeBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Параметры глаз
        let eyes = [];
        const currentEyeColor = '#ffffff'; // Белый цвет глаз (фиксированный)
        const currentPupilColor = '#222222'; // Темный цвет зрачков (фиксированный)

        // Обновление отображения значений
        function updateAllValues() {
            eyeCountValue.textContent = eyeCountSlider.value;
            minEyeSizeValue.textContent = minEyeSizeSlider.value + 'px';
            maxEyeSizeValue.textContent = maxEyeSizeSlider.value + 'px';
            sizeRangeValue.textContent = `${minEyeSizeSlider.value}-${maxEyeSizeSlider.value}px`;
            pupilSizeValue.textContent = pupilSizeSlider.value + '%';
            spacingValue.textContent = spacingSlider.value + 'px';
        }

        // Обработчики слайдеров
        eyeCountSlider.addEventListener('input', updateAllValues);
        minEyeSizeSlider.addEventListener('input', () => {
            const minValue = parseInt(minEyeSizeSlider.value);
            const maxValue = parseInt(maxEyeSizeSlider.value);
            
            if (minValue > maxValue) {
                maxEyeSizeSlider.value = minValue;
            }
            updateAllValues();
        });

        maxEyeSizeSlider.addEventListener('input', () => {
            const minValue = parseInt(minEyeSizeSlider.value);
            const maxValue = parseInt(maxEyeSizeSlider.value);
            
            if (maxValue < minValue) {
                minEyeSizeSlider.value = maxValue;
            }
            updateAllValues();
        });

        pupilSizeSlider.addEventListener('input', updateAllValues);
        spacingSlider.addEventListener('input', updateAllValues);

        // Функция получения случайного размера глаза
        function getRandomEyeSize() {
            const minSize = parseInt(minEyeSizeSlider.value);
            const maxSize = parseInt(maxEyeSizeSlider.value);
            return Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
        }

        // Проверка пересечения глаз (с учетом отступов)
        function checkCollision(x, y, size, existingEyes) {
            const safeSpacing = parseInt(spacingSlider.value);
            
            for (const eye of existingEyes) {
                const distance = Math.sqrt(
                    Math.pow(x - eye.centerX, 2) + 
                    Math.pow(y - eye.centerY, 2)
                );
                
                const minDistance = (size + eye.size) / 2 + safeSpacing;
                
                if (distance < minDistance) {
                    return true; // Пересечение обнаружено
                }
            }
            return false; // Пересечений нет
        }

        // Поиск свободного места для глаза
        function findPlaceForEye(size, maxAttempts = 100) {
            const squareWidth = square.clientWidth;
            const squareHeight = square.clientHeight;
            const safeSpacing = parseInt(spacingSlider.value);
            
            // Если глаз слишком большой для квадрата с учетом отступов
            if (size > squareWidth - safeSpacing * 2 || size > squareHeight - safeSpacing * 2) {
                return null;
            }
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = safeSpacing + Math.random() * (squareWidth - size - safeSpacing * 2);
                const y = safeSpacing + Math.random() * (squareHeight - size - safeSpacing * 2);
                const centerX = x + size / 2;
                const centerY = y + size / 2;
                
                if (!checkCollision(centerX, centerY, size, eyes)) {
                    return { x, y, centerX, centerY };
                }
            }
            
            return null;
        }

        // Создание одного глаза с проверкой пересечений
        function createEyeWithPlacement(size = null) {
            const eyeSize = size || getRandomEyeSize();
            const position = findPlaceForEye(eyeSize);
            
            if (!position) {
                console.warn(`Не удалось разместить глаз размером ${eyeSize}px`);
                return null;
            }
            
            return createEyeAtPosition(position.x, position.y, eyeSize);
        }

        // Создание глаза в конкретной позиции
        function createEyeAtPosition(x, y, eyeSize) {
            const pupilSizePercent = parseInt(pupilSizeSlider.value) / 100;
            const pupilSize = Math.max(5, eyeSize * pupilSizePercent);
            
            // Создаем контейнер глаза
            const eye = document.createElement('div');
            eye.className = 'eye';
            eye.style.left = `${x}px`;
            eye.style.top = `${y}px`;
            eye.style.width = `${eyeSize}px`;
            eye.style.height = `${eyeSize}px`;
            
            // Внешняя часть глаза
            const eyeOuter = document.createElement('div');
            eyeOuter.className = 'eye-outer';
            eyeOuter.style.backgroundColor = currentEyeColor;
            
            // Внутренняя часть глаза (зрачок)
            const eyeInner = document.createElement('div');
            eyeInner.className = 'eye-inner';
            eyeInner.style.width = `${pupilSize}px`;
            eyeInner.style.height = `${pupilSize}px`;
            eyeInner.style.backgroundColor = currentPupilColor;
            
            // Собираем глаз
            eyeOuter.appendChild(eyeInner);
            eye.appendChild(eyeOuter);
            square.appendChild(eye);
            
            // Сохраняем информацию о глазе
            const eyeData = {
                element: eye,
                outer: eyeOuter,
                inner: eyeInner,
                x: x,
                y: y,
                size: eyeSize,
                pupilSize: pupilSize,
                centerX: x + eyeSize / 2,
                centerY: y + eyeSize / 2
            };
            
            eyes.push(eyeData);
            return eyeData;
        }

        // Генерация всех глаз с избеганием пересечений
        function generateEyes() {
            clearEyes();
            
            const count = parseInt(eyeCountSlider.value);
            let placedCount = 0;
            const maxTotalAttempts = count * 200; // Максимальное общее количество попыток
            
            for (let i = 0; i < count; i++) {
                const eye = createEyeWithPlacement();
                if (eye) {
                    placedCount++;
                } else {
                    // Если не удалось разместить глаз, пропускаем его
                    console.log(`Пропущен глаз ${i + 1} из-за нехватки места`);
                }
                
                // Защита от бесконечного цикла
                if (i > maxTotalAttempts) {
                    console.log(`Достигнут предел попыток. Размещено ${placedCount} из ${count} глаз`);
                    break;
                }
            }
            
            console.log(`Размещено ${placedCount} глаз из ${count} запрошенных`);
        }

        // Добавление одного глаза
        function addRandomEye() {
            const eye = createEyeWithPlacement();
            if (!eye) {
                alert('Не удалось найти место для нового глаза. Попробуйте уменьшить размер глаз или расстояние между ними.');
            }
        }

        // Очистка всех глаз
        function clearEyes() {
            eyes.forEach(eye => {
                if (eye.element.parentNode) {
                    eye.element.parentNode.removeChild(eye.element);
                }
            });
            eyes = [];
        }

        // Функция слежения глаз за курсором
        function updateEyeTracking(e) {
            const rect = square.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            eyes.forEach(eye => {
                const centerX = eye.x + eye.size / 2;
                const centerY = eye.y + eye.size / 2;
                
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                const maxOffset = (eye.size - eye.pupilSize) / 2;
                
                if (distance < maxOffset) {
                    eye.inner.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                } else if (distance > 0) {
                    const scale = maxOffset / distance;
                    const offsetX = dx * scale;
                    const offsetY = dy * scale;
                    
                    eye.inner.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                } else {
                    eye.inner.style.transform = 'translate(-50%, -50%)';
                }
            });
        }

        // События мыши
        square.addEventListener('mousemove', updateEyeTracking);
        
        document.addEventListener('mousemove', (e) => {
            const rect = square.getBoundingClientRect();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const isInside = mouseX >= rect.left && mouseX <= rect.right && 
                            mouseY >= rect.top && mouseY <= rect.bottom;
            
            if (!isInside) {
                const squareCenterX = square.clientWidth / 2;
                const squareCenterY = square.clientHeight / 2;
                
                eyes.forEach(eye => {
                    const centerX = eye.x + eye.size / 2;
                    const centerY = eye.y + eye.size / 2;
                    
                    const dx = squareCenterX - centerX;
                    const dy = squareCenterY - centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    const maxOffset = (eye.size - eye.pupilSize) / 2;
                    
                    if (distance > 0) {
                        const scale = Math.min(maxOffset, distance / 10) / distance;
                        const offsetX = dx * scale;
                        const offsetY = dy * scale;
                        
                        eye.inner.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                    } else {
                        eye.inner.style.transform = 'translate(-50%, -50%)';
                    }
                });
            }
        });

        // Обработчики кнопок
        generateBtn.addEventListener('click', generateEyes);
        addEyeBtn.addEventListener('click', addRandomEye);
        clearBtn.addEventListener('click', clearEyes);

        // Инициализация
        window.addEventListener('load', () => {
            updateAllValues();
            generateEyes();
            
            // Анимация появления
            square.style.opacity = '0';
            square.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                square.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                square.style.opacity = '1';
                square.style.transform = 'scale(1)';
            }, 100);
        });

        // Обновление при ресайзе
        window.addEventListener('resize', () => {
            updateAllValues();
        });

        // Обновление размера квадрата при изменении размеров контейнера
        const resizeObserver = new ResizeObserver(() => {
            updateAllValues();
        });
        
        resizeObserver.observe(squareContainer);
    </script>
</body>
</html>
